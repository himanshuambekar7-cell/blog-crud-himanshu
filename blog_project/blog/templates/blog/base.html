<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Blog{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #fdfed7;
        }
        .navbar {
            margin-bottom: 20px;
        }
        .card {
            border-radius: 10px;
        }
    </style>
</head>
<body>

<!-- NEW NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand text-warning" href="#">My Blog</a>

    <div class="d-flex">
        {% if user.is_authenticated %}
            <span class="text-warning me-3 fw-bold">Hi, {{ user.username }}</span>
           <form action="{% url 'logout' %}" method="post">

    {% csrf_token %}
    <button type="submit">Logout</button>
</form>

        {% else %}
            <a href="{% url 'login' %}" class="btn btn-outline-warning btn-sm me-2">Login</a>
            <a href="{% url 'signup' %}" class="btn btn-warning btn-sm">Sign Up</a>
        {% endif %}
    </div>
</nav>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
